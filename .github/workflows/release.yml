name: Release

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
      - '!v*[!0-9.]*'

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: write
      pull-requests: read
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26.x'
          cache: npm

      - name: Verify release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/release/verify-release-tag.sh

      - name: Find previous release
        id: previous_release
        env:
          RELEASE_SHA: ${{ github.sha }}
        run: bash scripts/release/find-previous-release.sh

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

      - name: Generate release notes
        id: release_notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.previous_tag }}
        run: bash scripts/release/generate-release-notes.sh

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/dormindev/nekuvio:${{ github.ref_name }}
            ghcr.io/dormindev/nekuvio:latest
          labels: |
            org.opencontainers.image.source=https://github.com/dormindev/Nekuvio
            org.opencontainers.image.version=${{ github.ref_name }}
          provenance: true
          sbom: true

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.ref_name }}
          PREVIOUS_TAG: ${{ steps.previous_release.outputs.previous_tag }}
          NOTES_FILE: ${{ steps.release_notes.outputs.notes_file }}
        run: |
          set -euo pipefail

          RELEASE_ARGS=(
            "$RELEASE_TAG"
            --verify-tag
            --generate-notes
            --notes "$(cat "$NOTES_FILE")"
            --title "Nekuvio $RELEASE_TAG"
          )

          if [[ -n "$PREVIOUS_TAG" ]]; then
            RELEASE_ARGS+=(--notes-start-tag "$PREVIOUS_TAG")
          fi

          gh release create "${RELEASE_ARGS[@]}"
